[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.3.0",
    "duckdb>=1.3.2",
    "duckdb-engine>=0.17.0",
    "fastapi[standard]>=0.116.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "mkdocs-drawio>=1.11.2",
    "mkdocs-material>=9.6.17",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.9",
]

[tool.pytest.ini_options]
addopts = """
    -ra -q
    --cov=src
    --cov-report=term-missing
    --cov-report=html
"""
minversion = "6.0"
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]
