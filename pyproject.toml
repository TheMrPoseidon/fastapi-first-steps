[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.117.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.12",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "mkdocs-drawio>=1.11.2",
    "mkdocs-material>=9.6.20",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
addopts = """
    -ra -q
    --cov=app
    --cov-report=term-missing
    --cov-report=html
"""
minversion = "6.0"
testpaths = [
    "tests"
]
pythonpath = [
    "app"
]
